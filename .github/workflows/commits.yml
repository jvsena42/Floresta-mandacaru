# SPDX-License-Identifier: MIT OR Apache-2.0

name: Commits

on:
  pull_request:

# A push over a branch (a rebase, a rebuilt stack of PRs) supersedes the runs of the commits it
# replaced. Cancel those instead of letting them queue ahead of the new ones. Runs on master
# are never cancelled, so every merged commit keeps its full result.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/master' }}

permissions: {}

jobs:
    commit-signatures:
        name: Commit Signatures
        runs-on: ubuntu-latest

        steps:
            - name: Checkout Repository
              uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
              with:
                  persist-credentials: false
                  fetch-depth: 0

            - name: Check Commit Signatures
              run: bash contrib/commit-signatures.sh

    conventional-commits:
        name: Conventional Commits
        runs-on: ubuntu-latest

        steps:
            - name: Checkout Repository
              uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
              with:
                persist-credentials: false

            - name: Check Commit Messages
              uses: webiny/action-conventional-commits@7f91b1595ca1951cdb671ddc9f07a49081ec5b69 # v1.4.2
              with:
                  allowed-commit-types: "feat,fix,docs,style,refactor,test,perf,ci,chore,fuzz,bench"
